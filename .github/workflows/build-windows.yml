# Builds the Windows installer for the Shorts app on a free
# GitHub-hosted Windows runner — no Windows PC needed to build.
#
# How it works:
#   1. Push a tag like v1.0.0 (or run it by hand from the
#      Actions tab) and the workflow builds shorts-app.exe with
#      PyInstaller, smoke-tests it, then wraps it in a proper
#      installer with Inno Setup.
#   2. The installer (ShortsApp-Setup-1.0.0.exe) is uploaded as
#      a workflow artifact, and on a tag push it is attached to
#      a GitHub Release — that is the file the user downloads,
#      installs, and runs. No Python, FFmpeg, venv or build
#      steps on their machine: FFmpeg is bundled into the exe
#      by the spec, and the installer only copies files.
#
# The user still needs internet on first run: the Whisper tiny
# model (~75 MB) downloads once from HuggingFace.

name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Inno Setup
        run: choco install ffmpeg innosetup -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the exe
        run: pyinstaller shorts-app.spec

      - name: Smoke-test the exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\shorts-app.exe --smoke-test

      - name: Build the installer
        run: iscc packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortsApp-Setup
          path: installer\ShortsApp-Setup-*.exe

      - name: Attach installer to a Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\ShortsApp-Setup-*.exe
