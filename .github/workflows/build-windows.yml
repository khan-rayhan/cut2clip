# Builds the Windows installer for the Shorts app on a free
# GitHub-hosted Windows runner — no Windows PC needed to build.
#
# How it works:
#   1. Push a tag like v1.0.0 (or run it by hand from the
#      Actions tab) and the workflow builds cut2clip.exe with
#      PyInstaller, smoke-tests it, then wraps it in a proper
#      installer with Inno Setup.
#   2. The installer (Cut2Clip-Setup-<version>.exe) is uploaded as
#      a workflow artifact, and on a tag push it is attached to
#      a GitHub Release — that is the file the user downloads,
#      installs, and runs. No Python, FFmpeg, venv or build
#      steps on their machine: FFmpeg is bundled into the exe
#      by the spec, and the installer only copies files.
#
# The user still needs internet on first run: the Whisper tiny
# model (~75 MB) downloads once from HuggingFace.

name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Inno Setup
        run: choco install ffmpeg innosetup -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run offline automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not integration and not model_integration and not slow"

      - name: Check runtime dependencies
        run: python -m src.doctor

      - name: Build the exe
        run: pyinstaller --clean --noconfirm cut2clip.spec

      - name: Smoke-test the exe
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          # A windowed exe is not waited on by the shell, so wait explicitly
          # and check the exit code; otherwise this step can never fail.
          $p = Start-Process -FilePath .\dist\cut2clip.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }

      - name: Build the installer
        run: iscc packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cut2Clip-Setup
          path: installer\Cut2Clip-Setup-*.exe

      - name: Attach installer to a Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Cut2Clip-Setup-*.exe
