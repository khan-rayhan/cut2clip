[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cut2clip"
version = "1.0.2"
description = "Desktop app that turns video and live stream URLs into 40-second vertical Shorts/Reels."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.1.1",
    "numpy>=1.26",
    "streamlink>=8.0",
    "chat-downloader>=0.2.0",
    "faster-whisper>=1.0",
    "av>=11,<14",  # faster-whisper 1.2.1 needs av.open(metadata_errors=...), gone in av 14+
    "mediapipe>=1.2",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
    "PySide6>=6.6",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]
